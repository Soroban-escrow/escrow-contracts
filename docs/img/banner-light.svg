<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SkillEscrow Bounties — merge is the approval">
  <rect width="1200" height="340" fill="#f6f5f1"/>
  <rect x="0" y="0" width="1200" height="4" fill="#c9f25d"/>

  <!-- wordmark -->
  <rect x="72" y="58" width="14" height="14" rx="3" fill="#c9f25d" stroke="#121210" stroke-width="2"/>
  <text x="98" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#121210">skillescrow</text>

  <!-- headline -->
  <text x="72" y="150" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="62" fill="#121210">The escrow</text>
  <rect x="70" y="189" width="212" height="25" fill="#c9f25d"/>
  <text x="72" y="214" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="62" font-style="italic" fill="#121210">contract.</text>

  <text x="72" y="258" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" fill="#676660">A Soroban contract that holds a bounty until a pull request is merged,</text>
  <text x="72" y="284" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" fill="#676660">then pays its author — or returns the funds to the maintainer.</text>

  <!-- pipeline -->
  <line x1="772" y1="120" x2="1128" y2="120" stroke="#e0ddd5" stroke-width="2"/>
  <line x1="772" y1="120" x2="890" y2="120" stroke="#121210" stroke-width="2"/>
  <circle cx="772" cy="120" r="7" fill="#121210"/>
  <circle cx="890" cy="120" r="7" fill="#c9f25d" stroke="#121210" stroke-width="2"/>
  <circle cx="1008" cy="120" r="7" fill="#f6f5f1" stroke="#e0ddd5" stroke-width="2"/>
  <circle cx="1128" cy="120" r="7" fill="#f6f5f1" stroke="#e0ddd5" stroke-width="2"/>
  <text x="748" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#121210">Funded</text>
  <text x="854" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#121210">In review</text>
  <text x="976" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#676660">Merged</text>
  <text x="1104" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#676660">Paid</text>

  <!-- ledger row -->
  <line x1="748" y1="208" x2="1128" y2="208" stroke="#121210" stroke-width="2"/>
  <text x="748" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#676660">acme/widgets #7</text>
  <text x="748" y="262" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#121210">Retry failed HTTP requests</text>
  <rect x="976" y="236" width="152" height="34" rx="6" fill="#c9f25d"/>
  <text x="1000" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#172000">50.00 USDC</text>
  <line x1="748" y1="286" x2="1128" y2="286" stroke="#e0ddd5" stroke-width="1"/>
</svg>
